<details class="options-accordion">
  <summary>[ADVANCED SCAN PROFILE // DEPTH / RATE-LIMIT / PROXY / WORDLIST / SPA]</summary>
  <div class="options-grid">
    <div>
      <label class="field-label" for="opt_max_depth">MAX DEPTH (1-6)</label>
      <input id="opt_max_depth" name="max_depth" type="number" min="1" max="6" value="2" />
    </div>
    <div>
      <label class="field-label" for="opt_workers">BATCH WORKERS (1-4)</label>
      <input id="opt_workers" name="workers" type="number" min="1" max="4" value="2" />
    </div>
    <div>
      <label class="field-label" for="opt_jitter_min">JITTER MIN (MS)</label>
      <input id="opt_jitter_min" name="jitter_min_ms" type="number" min="0" max="30000" value="250" />
    </div>
    <div>
      <label class="field-label" for="opt_jitter_max">JITTER MAX (MS)</label>
      <input id="opt_jitter_max" name="jitter_max_ms" type="number" min="0" max="60000" value="750" />
    </div>
  </div>

  <label class="field-label" for="opt_proxy_url">OUTBOUND HTTP(S) PROXY (OPTIONAL // SSRF VALIDATED)</label>
  <input id="opt_proxy_url" name="proxy_url" type="text" placeholder="http://proxy.corp.example:3128" />

  <label class="field-label" for="opt_categories">DORK CATEGORY FILTER (COMMA-SEPARATED // EMPTY = ALL 295)</label>
  <div class="cat-filter-row">
    <input id="opt_categories" name="categories" type="text" placeholder="Passwords, Juicy Info, Login Portals" />
    <button type="button" class="btn-mini btn-load-cats">[CATALOG]</button>
  </div>
  <div class="cat-hint val-muted"></div>

  <label class="field-label" for="opt_custom_wordlist">CUSTOM PROBE WORDLIST (COMMA OR NEWLINE PATHS)</label>
  <textarea id="opt_custom_wordlist" name="custom_wordlist" rows="2" placeholder="/.git/config, /swagger.json, /admin-secret"></textarea>

  <label class="toggle-item">
    <input type="checkbox" name="spa_hydrate" />
    <span>STAGE-0 SPA DOM HYDRATION (HEADLESS CHROMIUM VIA SSRF PROXY)</span>
  </label>
</details>
