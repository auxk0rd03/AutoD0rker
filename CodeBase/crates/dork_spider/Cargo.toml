[package]
name = "dork_spider"
version = "1.0.0"
edition = "2024"
description = "CyberNest Labs AutoDorker: Linear-time BFS spider, Boolean Dork AST compiler, structural verifier, Shannon entropy engine, and HTMX OOB emitter"
license = "LicenseRef-CyberNest-Dual-Use"

[lib]
name = "dork_spider"
path = "src/lib.rs"

[[bin]]
name = "dork_spider"
path = "src/main.rs"

[[test]]
name = "test_dork_ast"
path = "../../tests/test_dork_ast.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1.3"
rand = "0.8"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
